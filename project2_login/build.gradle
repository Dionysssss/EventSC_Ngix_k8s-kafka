// Root-level build.gradle file

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1' // Adjust to your Gradle version
        classpath 'com.google.gms:google-services:4.3.15' // Google Services classpath
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}