name: ci-cd

on:
  push:
    branches: [ YM ]
  pull_request:
    branches: [ YM ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build auth-service
        run: mvn -q -DskipTests -f auth-service/pom.xml package

      - name: Build event-service
        run: mvn -q -DskipTests -f event-service/pom.xml package

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth-service image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/auth-service
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest auth-service
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Build and push event-service image
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/event-service
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest event-service
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
