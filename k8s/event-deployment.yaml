apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: eventsc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: docker.io/lancexie2214/event-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: event-db
                  key: url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: event-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: event-db
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: eventsc
spec:
  selector:
    app: event-service
  ports:
    - port: 8080
      targetPort: 8080
