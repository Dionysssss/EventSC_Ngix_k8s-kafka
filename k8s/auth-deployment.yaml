apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: eventsc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker.io/lancexie2214/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: mail-config
                  key: host
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: mail-config
                  key: port
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: password
            - name: MAGIC_LINK_BASE_URL
              value: "http://event-service:8080"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: eventsc
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
