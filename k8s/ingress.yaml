apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventsc-ingress
  namespace: eventsc
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: eventsc.test
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-service
                port:
                  number: 8080
